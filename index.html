<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maaf Garideu 🙏</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    position: relative;
    overflow: hidden;
  }

  .card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    max-width: 420px;
    width: 90%;
    position: relative;
    z-index: 2;
    animation: popIn 0.5s ease;
  }

  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .emoji {
    font-size: 60px;
    margin-bottom: 10px;
    display: block;
  }

  h1 {
    color: #d63384;
    font-size: 26px;
    margin-bottom: 10px;
  }

  p {
    color: #555;
    font-size: 16px;
    margin-bottom: 30px;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    position: relative;
    height: 60px;
    align-items: center;
  }

  button {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.3s ease;
  }

  #introBtn {
    background: #6f42c1;
    color: white;
  }

  #introBtn:hover {
    transform: scale(1.08);
    background: #5a34a3;
  }

  #yesBtn {
    background: #28a745;
    color: white;
    transition: transform 0.2s ease, font-size 0.2s ease;
  }

  #yesBtn:hover {
    transform: scale(1.08);
    background: #218838;
  }

  #noBtn {
    background: #dc3545;
    color: white;
    position: relative;
  }

  .success {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  .success .emoji {
    font-size: 70px;
  }

  .success h2 {
    color: #28a745;
    margin-bottom: 8px;
  }

  .success p {
    margin-bottom: 0;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 480px) {
    .card {
      padding: 35px 22px;
      border-radius: 18px;
    }

    .emoji {
      font-size: 46px;
    }

    h1 {
      font-size: 21px;
    }

    p {
      font-size: 14px;
      margin-bottom: 22px;
    }

    button {
      padding: 12px 22px;
      font-size: 14px;
    }

    .btn-row {
      gap: 14px;
    }
  }
</style>
</head>
<body>

  <div class="card" id="mainCard">
    <div id="introSection">
      <span class="emoji">💌</span>
      <h1>Ek chin...</h1>
      <p>Malai timi lai kehi vanna man lagyo.</p>
      <div class="btn-row" style="justify-content:center;">
        <button id="introBtn" onclick="showQuestion()">I wanna say something 💬</button>
      </div>
    </div>

    <div id="questionSection" class="hidden">
      <span class="emoji">🥺</span>
      <h1>Malai maaf garideu na please...</h1>
      <p>Mailey jasari pani vanya, timi maaf garchau ki?</p>
      <div class="btn-row">
        <button id="yesBtn" onclick="sayYes()">Yes 💚</button>
        <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">No 😤</button>
      </div>
    </div>

    <div class="success" id="successSection">
      <span class="emoji">🥰</span>
      <h2>Yay!! Thank you ❤️</h2>
      <p>Malai thaha thiyo timi ramri/ramro chau!</p>
    </div>
  </div>

<script>
  const noBtn = document.getElementById('noBtn');
  const card = document.getElementById('mainCard');
  let scale = 1;

  function moveButton() {
    const cardRect = card.getBoundingClientRect();
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;

    // random position within the viewport, avoiding edges
    const maxX = window.innerWidth - btnWidth - 20;
    const maxY = window.innerHeight - btnHeight - 20;

    const randX = Math.max(20, Math.random() * maxX);
    const randY = Math.max(20, Math.random() * maxY);

    noBtn.style.position = 'fixed';
    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
    noBtn.style.zIndex = 999;

    // yes button grows a bit every time No runs away, taakati badiyera
    scale += 0.08;
    document.getElementById('yesBtn').style.transform = `scale(${scale})`;

    // change text to guilt-trip a little, for fun
    const texts = ["No 😤", "Aaunna! 😅", "Bachna khoji xa? 🏃", "Pakadna sakdena! 😂", "Yesma click gara na! 🙏", "Please... 🥺"];
    noBtn.innerText = texts[Math.min(Math.floor(scale * 5), texts.length - 1)];
  }

  function showQuestion() {
    document.getElementById('introSection').classList.add('hidden');
    document.getElementById('questionSection').classList.remove('hidden');
  }

  function sayYes() {
    document.getElementById('questionSection').classList.add('hidden');
    document.getElementById('successSection').style.display = 'flex';
  }
</script>

</body>
</html>
